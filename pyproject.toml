[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "klipper-calibration-wizard"
version = "0.1.2"
description = "A safe, modular calibration wizard for Klipper printers"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "HerrHaseGermany" }]
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
]

[project.scripts]
klipper-calibration-wizard = "calibration_wizard.main:run"

[tool.hatch.build.targets.wheel]
packages = ["backend/src/calibration_wizard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["UP045"] # Pydantic evaluates model annotations on supported Python 3.9.
