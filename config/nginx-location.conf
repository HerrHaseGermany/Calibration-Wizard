    # BEGIN klipper-calibration-wizard
    location = /tools {
        return 301 /tools/$is_args$args;
    }

    location = /tools/ {
        proxy_pass http://127.0.0.1:7130/api/mainsail/entry;
        proxy_set_header Host $http_host;
    }

    location /tools/app/ {
        proxy_pass http://127.0.0.1:7130/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400;
    }

    location /tools/standalone/ {
        proxy_pass http://127.0.0.1:7130/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400;
    }

    # Stock Mainsail service workers exclude /api/ navigation. Keep recovery
    # reachable even when an upstream update removes our own tools exclusion.
    location /api/klipper-tools/ {
        proxy_pass http://127.0.0.1:7130/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400;
    }

    # Preserve old bookmarks while migrating to /tools/.
    location = /calibration {
        return 301 /api/klipper-tools/$is_args$args;
    }
    location ~ ^/calibration/(.*)$ {
        return 301 /api/klipper-tools/$1$is_args$args;
    }
    # END klipper-calibration-wizard

